# Daily Macro Desk: weekdays at 00:17 UTC (05:47 IST), before the 06:37 Claude brief reads the snapshot.
#
# GitHub treats schedules as best effort: around the top of the hour a scheduled run can start
# late or not at all. Two backup slots (06:23 and 08:13 IST) start the same workflow, and the
# "check" job lets a scheduled run through only if no run has succeeded yet today (UTC).
# A manual "Run workflow" always goes ahead.
#
# Repository settings this workflow relies on:
#   Pages    Source = GitHub Actions    (Settings > Pages) for the public site and podcast feed
#   Secret   GEMINI_API_KEY             optional, free key from Google AI Studio (AI-written narrative)
#   Variable PUBLISH_ENABLED = "false"  optional: set it only to pause publishing (data keeps updating)
#   Secret   COMPLIANCE_TERMS           optional extra words for the compliance gate
name: Daily Macro Desk

on:
  schedule:
    - cron: "17 0 * * 1-5"   # main run, 05:47 IST
    - cron: "53 0 * * 1-5"   # backup, 06:23 IST (still before the 06:37 brief)
    - cron: "43 2 * * 1-5"   # backup, 08:13 IST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read   # lets the check job see today's earlier runs

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.today.outputs.go }}
    steps:
      - id: today
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          done=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/daily.yml/runs" \
                   -f created=">=$(date -u +%F)" -f status=success --jq '.total_count')
          echo "Successful runs today (UTC): $done"
          if [ "$done" = "0" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

  run:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Data, snapshot and brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_daily.py ${{ vars.PUBLISH_ENABLED != 'false' && '--publish' || '' }}

      - name: Central Bank Decoder (new Fed statements)
        continue-on-error: true
        run: python -m mql.decoder --check-feeds ${{ vars.PUBLISH_ENABLED == 'false' && '--no-publish' || '' }}

      - name: Model portfolio prices and NAV
        continue-on-error: true
        run: python -m mql.portfolio --update-prices --run

      - name: Compliance gate
        env:
          COMPLIANCE_TERMS: ${{ secrets.COMPLIANCE_TERMS }}
        run: python -m mql.compliance

      - name: Commit results
        run: |
          git config user.name "mql-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs README.md
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Daily run $(date -u +%F)"
          git pull --rebase --autostash
          git push

      - name: Restore recent audio episodes
        if: vars.PUBLISH_ENABLED != 'false'
        uses: actions/cache/restore@v4
        with:
          path: audio
          key: podcast-${{ github.run_id }}
          restore-keys: podcast-

      - name: Audio brief and podcast feed
        if: vars.PUBLISH_ENABLED != 'false'
        continue-on-error: true
        run: |
          python -m mql.podcast --audio-dir audio --keep 7
          mkdir -p docs/audio
          cp audio/*.mp3 docs/audio/ || true
          cp audio/podcast.xml docs/podcast.xml || true

      - name: Save audio episodes
        if: vars.PUBLISH_ENABLED != 'false'
        uses: actions/cache/save@v4
        with:
          path: audio
          key: podcast-${{ github.run_id }}

      - name: Build site
        if: vars.PUBLISH_ENABLED != 'false'
        run: mkdocs build

      - name: Upload site
        if: vars.PUBLISH_ENABLED != 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    if: vars.PUBLISH_ENABLED != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true   # until Pages is switched on in Settings, this step is skipped quietly
