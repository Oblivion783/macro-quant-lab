# Model portfolio factsheet: 2nd of each month, 02:07 UTC (07:37 IST), for the month just ended.
name: Monthly factsheet

on:
  schedule:
    - cron: "7 2 2 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to report (YYYY-MM); blank = last month"
        required: false

permissions:
  contents: write

jobs:
  factsheet:
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build factsheet
        run: |
          M="${{ github.event.inputs.month }}"
          if [ -z "$M" ]; then M=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m); fi
          python -m mql.portfolio --update-prices --factsheet "$M"
      - name: Compliance gate
        env:
          COMPLIANCE_TERMS: ${{ secrets.COMPLIANCE_TERMS }}
        run: python -m mql.compliance
      - name: Commit
        run: |
          git config user.name "mql-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio docs/portfolio
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Factsheet $(date -u +%F)"
          git pull --rebase --autostash
          git push
