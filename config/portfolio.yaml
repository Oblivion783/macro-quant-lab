# Model Portfolio Lab (Project 3): a paper-traded multi-asset portfolio with a written process.
#
# DRAFT strategic weights. Finalise them in docs/portfolio/ips.md by 31 Dec 2026; the portfolio
# goes live on 1 Jan 2027. After that, every change is a dated row in data/portfolio/decisions.csv
# committed to git (the commit timestamp is the audit trail).
#
# Proxies are liquid USD-listed ETFs chosen from several issuers; deliberately none managed by
# my employer, to avoid any conflict. Paper only: no real money, no recommendations.

name: Macro Quant Lab model portfolio
base_currency: USD
inception: "2027-01-01"
cost_bps: 5            # one-way trading cost assumed on every rebalance
tilt_limit: 0.05       # max active weight per sleeve versus strategic
rebalance: monthly     # plus any dated decision in decisions.csv

benchmark:             # 60/40 global equities / global aggregate bonds, rebalanced monthly
  equity: {ticker: VT, weight: 0.60}
  fixed_income: {ticker: BNDW, weight: 0.40}

sleeves:
  - {id: global_eq,   ticker: VT,   name: "Global equities",            asset_class: equity,       strategic: 0.42}
  - {id: india_eq,    ticker: FLIN, name: "India equities",             asset_class: equity,       strategic: 0.08}
  - {id: ust_int,     ticker: VGIT, name: "US Treasuries, intermediate", asset_class: fixed_income, strategic: 0.12}
  - {id: ust_long,    ticker: VGLT, name: "US Treasuries, long",        asset_class: fixed_income, strategic: 0.05}
  - {id: tips,        ticker: SCHP, name: "US TIPS",                    asset_class: fixed_income, strategic: 0.06}
  - {id: ig_credit,   ticker: VCIT, name: "US investment-grade credit", asset_class: fixed_income, strategic: 0.06}
  - {id: hy_credit,   ticker: JNK,  name: "US high-yield credit",       asset_class: fixed_income, strategic: 0.03}
  - {id: em_local,    ticker: EMLC, name: "EM local-currency debt",     asset_class: fixed_income, strategic: 0.03}
  - {id: gold,        ticker: GLDM, name: "Gold",                       asset_class: real_assets,  strategic: 0.05}
  - {id: commodities, ticker: PDBC, name: "Broad commodities",          asset_class: real_assets,  strategic: 0.05}
  - {id: cash,        ticker: BIL,  name: "Cash (1–3m T-bills)",        asset_class: cash,         strategic: 0.05}
